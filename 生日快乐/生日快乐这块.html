<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专属你的生日祝福 🎂</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(120deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 弹窗样式 - 核心新增部分 */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100; /* 弹窗层级最高 */
            animation: fadeIn 0.5s ease;
        }
        .popup-box {
            background: linear-gradient(135deg, #ff7eb3 0%, #ff65a3 100%);
            width: 90%;
            max-width: 500px;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(255, 101, 163, 0.4);
            position: relative;
            animation: popupScale 0.6s ease;
        }
        .popup-title {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        .popup-text {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .popup-btn {
            background: #fff;
            color: #ff65a3;
            border: none;
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .popup-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background: #f8f8f8;
        }
        /* 弹窗装饰元素 */
        .popup-box::before {
            content: '🎈';
            font-size: 3rem;
            position: absolute;
            top: -20px;
            left: 20px;
            animation: float 2s ease-in-out infinite;
        }
        .popup-box::after {
            content: '🎂';
            font-size: 3rem;
            position: absolute;
            top: -20px;
            right: 20px;
            animation: float 2s ease-in-out infinite 0.5s;
        }

        /* 弹窗动画 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes popupScale {
            0% { transform: scale(0.7); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 原有样式保留并优化 */
        .birthday-title {
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 10px #ff6b6b, 0 0 20px #ff6b6b, 0 0 30px #ff6b6b;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
            position: relative;
            z-index: 10;
        }
        .photo-container {
            width: 80%;
            max-width: 600px;
            height: 400px;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
        }
        .photo-slider {
            display: flex;
            width: 100%;
            height: 100%;
            animation: slide 15s infinite linear;
        }
        .photo-slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }
        @keyframes slide {
            0% { transform: translateX(0); }
            20% { transform: translateX(0); }
            25% { transform: translateX(-100%); }
            45% { transform: translateX(-100%); }
            50% { transform: translateX(-200%); }
            70% { transform: translateX(-200%); }
            75% { transform: translateX(-300%); }
            95% { transform: translateX(-300%); }
            100% { transform: translateX(0); }
        }
        .blessing {
            background: rgba(255,255,255,0.8);
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 1.2rem;
            color: #333;
            line-height: 1.8;
            text-align: center;
            max-width: 600px;
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .confetti {
            position: absolute;
            opacity: 0;
            animation: confetti 5s infinite linear;
            z-index: 1;
        }
        .confetti.square {
            width: 10px;
            height: 10px;
        }
        .confetti.circle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .confetti.triangle {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 15px solid;
        }
        @keyframes confetti {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 60px;
            height: 80px;
            background: hsl(var(--hue), 100%, 70%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: balloonFloat 8s infinite ease-in-out;
            z-index: 1;
        }
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 20px;
            background: #fff;
        }
        @keyframes balloonFloat {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
            }
            50% {
                transform: translateY(-80vh) translateX(30px) rotate(10deg);
            }
            100% {
                transform: translateY(0) translateX(-30px) rotate(-10deg);
            }
        }
        .music-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: #ff6b6b;
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 3px 10px rgba(255,107,107,0.3);
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }
        .music-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <!-- 生日弹窗 - 核心新增部分 -->
    <div class="popup-overlay" id="birthdayPopup">
        <div class="popup-box">
            <h2 class="popup-title">生日快乐 🎉</h2>
            <p class="popup-text">
                准备好接收这份专属的生日祝福了吗？<br>
                点击下方按钮，开启美好的祝福时光～
            </p>
            <button class="popup-btn" id="popupConfirmBtn">开启祝福</button>
        </div>
    </div>

    <!-- 音乐标签 -->
    <audio loop preload="auto" id="music">
        <source src="birthday.mp3" type="audio/mpeg">
    </audio>

    <h1 class="birthday-title">祝白洁同学前天生日快乐！🎈</h1>

    <!-- 照片轮播 -->
    <div class="photo-container">
        <div class="photo-slider">
            <img src="photo1.jpg" alt="回忆1">
            <img src="photo2.jpg" alt="回忆2">
            <img src="photo3.jpg" alt="回忆3">
            <img src="photo4.jpg" alt="回忆4">
        </div>
    </div>

    <!-- 个性化祝福语 -->
    <div class="blessing">
        白洁老师：<br>
        听说你前天又长大一岁啦！感谢相遇的时光，愿你永远开心、永远闪闪发光～<br>
        生日快乐，不止今天，而是每一天 ✨
    </div>

    <!-- 音乐按钮 -->
    <button class="music-btn" onclick="toggleMusic()">
        🎵 开启/关闭背景音乐
    </button>

    <script>
        // 核心元素获取
        const music = document.getElementById('music');
        const popupOverlay = document.getElementById('birthdayPopup');
        const popupConfirmBtn = document.getElementById('popupConfirmBtn');

        // 弹窗确认按钮点击事件（用户交互触发音乐播放）
        popupConfirmBtn.addEventListener('click', () => {
            // 1. 播放音乐（此时有用户交互，可正常播放）
            music.play().then(() => {
                console.log('音乐已通过用户交互正常播放');
            }).catch(err => {
                console.log('音乐播放失败:', err);
                alert('音乐播放失败，请检查文件路径或浏览器设置');
            });
            
            // 2. 隐藏弹窗
            popupOverlay.style.display = 'none';
            
            // 3. 初始化装饰效果（弹窗关闭后再显示，增强体验）
            createConfetti();
            createBalloons();
        });

        // 音乐控制函数
        function toggleMusic() {
            if (music.paused) {
                music.play().catch(err => console.log('播放失败:', err));
            } else {
                music.pause();
            }
        }

        // 生成纸屑装饰
        function createConfetti() {
            const confettiCount = 100;
            const shapes = ['square', 'circle', 'triangle'];
            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                const shape = shapes[Math.floor(Math.random() * shapes.length)];
                confetti.className = `confetti ${shape}`;
                
                confetti.style.left = Math.random() * 100 + 'vw';
                const hue = Math.random() * 360;
                if (shape === 'triangle') {
                    confetti.style.borderBottomColor = `hsl(${hue}, 100%, 50%)`;
                } else {
                    confetti.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
                }
                confetti.style.animationDelay = Math.random() * 8 + 's';
                confetti.style.animationDuration = 3 + Math.random() * 7 + 's';
                document.body.appendChild(confetti);
            }
        }

        // 生成气球装饰
        function createBalloons() {
            const balloonCount = 15;
            for (let i = 0; i < balloonCount; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.left = Math.random() * 100 + 'vw';
                balloon.style.setProperty('--hue', Math.random() * 360);
                balloon.style.animationDelay = Math.random() * 10 + 's';
                balloon.style.animationDuration = 15 + Math.random() * 10 + 's';
                document.body.appendChild(balloon);
            }
        }
    </script>
</body>
</html>
